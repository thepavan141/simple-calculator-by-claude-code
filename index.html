<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="static/style.css">
    <style>
        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .calculator {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 320px;
        }
        .display {
            background: #e9ecef;
            padding: 20px;
            border-radius: 10px;
            text-align: right;
            margin-bottom: 15px;
            font-size: 2rem;
            overflow: hidden;
            min-height: 60px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            background-color: #d2d2d2;
            color: #333;
        }
        button:hover {
            filter: brightness(0.9);
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(0);
        }
        .btn-op { background-color: #ff9500; color: white; }
        .btn-eq { background-color: #4caf50; color: white; grid-column: span 2; }
        .btn-clear { background-color: #ff5252; color: white; grid-column: span 2; }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="btn-clear" onclick="clearDisplay()">Clear</button>
            <button class="btn-op" onclick="setOp('/')">/</button>
            <button class="btn-op" onclick="setOp('*')">×</button>

            <button onclick="appendNum('7')">7</button>
            <button onclick="appendNum('8')">8</button>
            <button onclick="appendNum('9')">9</button>
            <button class="btn-op" onclick="setOp('-')">-</button>

            <button onclick="appendNum('4')">4</button>
            <button onclick="appendNum('5')">5</button>
            <button onclick="appendNum('6')">6</button>
            <button class="btn-op" onclick="setOp('+')">+</button>

            <button onclick="appendNum('1')">1</button>
            <button onclick="appendNum('2')">2</button>
            <button onclick="appendNum('3')">3</button>
            <button class="btn-eq" onclick="calculate()">=</button>

            <button onclick="appendNum('0')">0</button>
            <button onclick="appendNum('.')">.</button>
        </div>
    </div>

    <script src="static/script.js"></script>
</body>
</html>
